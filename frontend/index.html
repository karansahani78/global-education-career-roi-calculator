<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      CHANGE: Added viewport-fit=cover
      REASON: Enables env(safe-area-inset-*) CSS variables on iOS notch /
              Dynamic Island / iPad home indicator. No scroll impact.
      CHANGE: Added interactive-widget=resizes-content
      REASON: Tells Android Chrome to resize content (not viewport) when the
              soft keyboard opens. Prevents scroll jump / layout shift.
              Does NOT affect desktop or iOS scroll.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <!--
      theme-color tints Android Chrome browser chrome. The media query covers
      system preference; the inline theme script below updates the unsuffixed
      tag when the user overrides the preference with the header toggle.
    -->
    <meta name="theme-color" content="#f7f7f4" />
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />

    <!--
      CHANGE: iOS standalone meta tags
      REASON: Ensures proper display when added to iOS home screen.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Apply the stored/system theme before first paint to avoid a light flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored === 'dark' ||
            (!stored || stored === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          var themeMeta = document.querySelector('meta[name="theme-color"]:not([media])');
          if (themeMeta) themeMeta.setAttribute('content', dark ? '#0b0f19' : '#f7f7f4');
          var statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (statusMeta) statusMeta.setAttribute('content', dark ? 'black-translucent' : 'default');
        } catch (error) {
          /* Storage may be unavailable; system preference still applies. */
        }
      })();
    </script>

    <!-- ── SEO: title + description updated from placeholder ─────────────── -->
    <title>EduROI — College Major ROI & Salary Calculator</title>
    <meta
      name="description"
      content="Calculate the true return on your education investment. Compare universities, majors, and countries to make data-driven decisions about your future."
    />
    <meta name="author" content="EduROI" />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <link rel="canonical" href="https://eduroi.com/" />

    <!-- ── Open Graph ─────────────────────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://eduroi.com/" />
    <meta property="og:title"       content="EduROI — College Major ROI & Salary Calculator" />
    <meta property="og:description" content="Calculate the true return on your education investment. Compare universities, majors, and countries to make data-driven decisions about your future." />
    <meta property="og:image"       content="https://eduroi.com/og-image.png" />
    <meta property="og:site_name"   content="EduROI" />

    <!-- ── Twitter Card ───────────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />

    <meta name="twitter:title"       content="EduROI — College Major ROI & Salary Calculator" />
    <meta name="twitter:description" content="Calculate the true return on your education investment. Compare universities, majors, and countries to make data-driven decisions about your future." />
    <meta name="twitter:image"       content="https://eduroi.com/og-image.png" />

    <!-- Ad placements are placeholders until a real publisher ID is configured. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
